services:
  postgres:
    image: postgres:latest
    container_name: dbt_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbtuser -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  airflow:
    image: apache/airflow:2.7.2-python3.9
    container_name: airflow
    restart: always
    depends_on: 
      postgres:
        condition: 
          service_healthy
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./online_retail:/usr/app/online_retail
    ports:
      - "8080:8081"
    command: webserver
  
  airflow_scheduler:
    image: apache/airflow:2.7.2-python3.9
    container_name: airflow_scheduler
    restart: always
    depends_on:
      - airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./online_retail:/usr/app/online_retail
    command: scheduler

  pgadmin:
    image: elestio/pgadmin
    container_name: pgadmin_dbt
    restart: always
    ports: 
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL} 
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD} 
      volumes: pgadmin_data:/var/lib/pgadmin


  data_init:
    image: python:3.11-slim
    container_name: pg_init_data_load
    volumes:
      - .:/usr/app
    working_dir: /usr/app/src
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: >
      bash -c "pip install sqlalchemy pandas openpyxl && python insert_data.py"


  dbt:
    image: python:3.11-slim 
    container_name: dbt_core
    ports:
      - "3000:8080" # Maps container's port 8080 to local machine's port 8080
    volumes:
      - .:/usr/app 
    working_dir: /usr/app/online_retail
    depends_on:
      data_init:
        condition: service_completed_successfully
    environment:
      DBT_PROFILES_DIR: /usr/app/online_retail # Ensures dbt uses your profiles.yml file from the project directory
    entrypoint: ["tail", "-f", "/dev/null"] # Keeps the dbt container running
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env


volumes:
  pg_data:
  pgadmin_data: